<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Presentes</title>
    <link rel="stylesheet" href="css/stylePresente.css" />
    <link rel="stylesheet" href="css/styleFundo.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

    <!-- ===== LISTA DE PRESENTES ===== -->
    <section id="presentes" class="secao-presentes">
      
      <!-- Cabeçalho e lista de presentes -->
      <div id="presentesListagem" class="presentes-listagem">
        <div class="cabecalho-presentes">
          <img src="imgs/folha.png" alt="Folha decorativa" class="folha-roxa" />
          <h1 class="sdn-titulo-pagina">Lista de presentes</h1>
        </div>

        <div class="top-bar">
          <button id="cartButton" class="cart">Carrinho vazio</button>

          <div class="sort">
            <label for="ordenar">Ordenar lista por:</label>
            <select id="ordenar">
              <option value="az">A-Z</option>
              <option value="preco">Menor Preço</option>
            </select>
          </div>
        </div>

        <div class="gift-container">
          <div class="container" id="giftContainer">
            <div class="card" data-preco="1693.46">
              <img
                src="fotosPresentes/tv.jpeg"
                alt="AOC Roku TV Smart TV LED 32""
                class="gift-image"
              />
              <h3 class="gift-title">AOC Roku TV Smart TV LED 32"</h3>
              <p class="gift-price">R$ 1.693,46</p>
              <button class="gift-button">Presentear</button>
            </div>

            <div class="card" data-preco="249.66">
              <img
                src="fotosPresentes/aparelho-de-jantar-em-porcelana-12-pecas.jpg"
                alt="Aparelho de jantar"
                class="gift-image"
              />
              <h3 class="gift-title">Aparelho de jantar</h3>
              <p class="gift-price">R$ 249,66</p>
              <a href="carrinho.html">
                <button class="gift-button">Presentear</button>
              </a>
            </div>

            <!-- COLOQUE AQUI TODOS OS OUTROS CARDS DE PRESENTES -->
            <!-- ... continue com o resto dos cards ... -->

          </div>
        </div>
      </div>

      <!-- Carrinho -->
      <section id="cartSection" class="cart-section hidden">
        <div class="cabecalho-presentes">
          <img src="imgs/folha.png" alt="Folha decorativa" class="folha-roxa" />
          <h2 class="sdn-titulo-pagina">Meu carrinho</h2>
        </div>
        
        <table class="cart-table">
          <thead>
            <tr>
              <th>Descrição do presente</th>
              <th>Valor</th>
            </tr>
          </thead>
          <tbody id="cartItems"></tbody>
        </table>
        
        <div class="cart-total">
          <strong>Total:</strong> <span id="cartTotal">R$ 0,00</span>
        </div>

        <div class="cart-buttons">
          <button id="addMore" class="btn-gray">Adicionar mais itens</button>
          <button id="finalizarCompra" class="btn-pink">Continuar compra</button>
        </div>
      </section>

      <!-- Resumo da Compra -->
      <section id="resumoSection" class="hidden resumo-section">
        <div class="cabecalho-presentes">
          <img src="imgs/folha.png" alt="Folha decorativa" class="folha-roxa" />
          <h2 class="sdn-titulo-pagina">Resumo da sua compra</h2>
        </div>
        
        <div class="resumo-container">
          <div class="resumo-grid">
            <div class="resumo-box">
              <div class="linha">
                <span>Valor Total dos Presentes</span>
                <span id="subtotalDisplay">R$ 0,00</span>
              </div>
              <div class="linha desconto">
                <span>Desconto Progressivo</span>
                <span id="descontoDisplay">- R$ 0,00</span>
              </div>
              <div class="linha total">
                <span>Total</span>
                <span id="totalFinalDisplay">R$ 0,00</span>
              </div>
            </div>
          </div>

          <div class="botoes-resumo">
            <button id="voltarCarrinho" class="btn-gray">
              Voltar para o carrinho
            </button>
            <a href="telapagamento.html" id="irParaPagamento" class="btn-pink">
              Concluir compra
            </a>
          </div>
        </div>
      </section>
    </section>

        <!--==================================PROBLEMA TERMINA AQUI==========================================================-->

    <footer class="footerRodapé">
      <p>Martha & Odilon</p>
    </footer>

    <script>
      const ordenarSelect = document.getElementById("ordenar");
      const giftContainer = document.getElementById("giftContainer");
      const cartButton = document.getElementById("cartButton");
      const cartSection = document.getElementById("cartSection");
      const cartItems = document.getElementById("cartItems");
      const cartTotal = document.getElementById("cartTotal");
      const addMoreBtn = document.getElementById("addMore");
      const resumoSection = document.getElementById("resumoSection");
      const finalizarCompra = document.getElementById("finalizarCompra");
      const voltarCarrinho = document.getElementById("voltarCarrinho");
      const subtotalDisplay = document.getElementById("subtotalDisplay");
      const descontoDisplay = document.getElementById("descontoDisplay");
      const totalFinalDisplay = document.getElementById("totalFinalDisplay");
      const irParaPagamentoBtn = document.getElementById("irParaPagamento");
      let cart = [];

      // Carregar carrinho salvo
      document.addEventListener("DOMContentLoaded", () => {
        const savedCart = localStorage.getItem("carrinho");
        if (savedCart) {
          cart = JSON.parse(savedCart);
          atualizarCarrinho();

          if (cart.length > 0) {
            cartSection.classList.remove("hidden");
            giftContainer.classList.add("hidden");
            document.querySelector(".top-bar").style.display = "none";
          }
        }
      });

      function salvarCarrinho() {
        localStorage.setItem("carrinho", JSON.stringify(cart));
      }

      // Ordenar lista
      ordenarSelect.addEventListener("change", () => {
        const cards = Array.from(giftContainer.children);
        if (ordenarSelect.value === "az") {
          cards.sort((a, b) =>
            a
              .querySelector(".gift-title")
              .textContent.localeCompare(
                b.querySelector(".gift-title").textContent
              )
          );
        } else if (ordenarSelect.value === "preco") {
          cards.sort(
            (a, b) => parseFloat(a.dataset.preco) - parseFloat(b.dataset.preco)
          );
        }
        giftContainer.innerHTML = "";
        cards.forEach((c) => giftContainer.appendChild(c));
      });

      // Adicionar ao carrinho
      document.querySelectorAll(".gift-button").forEach((button) => {
        button.addEventListener("click", (e) => {
          const card = e.target.closest(".card");
          const title = card.querySelector(".gift-title").textContent;
          const price = card.querySelector(".gift-price").textContent;
          const image = card.querySelector(".gift-image").src;

          cart.push({ title, price, image });
          atualizarCarrinho();
          salvarCarrinho();

          cartSection.classList.remove("hidden");
          giftContainer.classList.add("hidden");
          document.querySelector(".top-bar").style.display = "none";
        });
      });

      // Atualizar carrinho
      function atualizarCarrinho() {
        cartItems.innerHTML = "";
        let total = 0;

        cart.forEach((item, index) => {
          const precoNum = parseFloat(
            item.price.replace(/[R$\s.]/g, "").replace(",", ".")
          );
          total += precoNum;

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>
              <div class="cart-item">
                <img src="${item.image}">
                <div>
                  <div class="cart-item-title">${item.title}</div>
                  <div class="remove" data-index="${index}">Remover</div>
                </div>
              </div>
            </td>
            <td>R$ ${precoNum.toFixed(2).replace(".", ",")}</td>
          `;
          cartItems.appendChild(tr);
        });

        cartTotal.textContent = `R$ ${total.toFixed(2).replace(".", ",")}`;
        cartButton.textContent = cart.length
          ? `🛒 Carrinho (${cart.length})`
          : "🛒 Carrinho vazio";
      }

      function carregarResumo() {
        // 1. Obter o total atual do carrinho (valor formatado)
        const totalString = cartTotal.textContent;

        // 2. Extrair o valor numérico para cálculo (para o JS)
        const totalNum = parseFloat(
          totalString.replace(/[R$\s]/g, "").replace(",", ".")
        );

        // 3. Lógica de Desconto (por enquanto, 0)
        const valorDesconto = 0.0;
        const totalFinalNum = totalNum - valorDesconto;

        // 4. Formatar os valores
        const descontoFormatado = `- R$ ${valorDesconto
          .toFixed(2)
          .replace(".", ",")}`;
        const totalFinalFormatado = `R$ ${totalFinalNum
          .toFixed(2)
          .replace(".", ",")}`;

        // 5. Preencher os campos do resumo
        subtotalDisplay.textContent = totalString;
        descontoDisplay.textContent = descontoFormatado;
        totalFinalDisplay.textContent = totalFinalFormatado;

        // Salvar o subtotal formatado no localStorage
        localStorage.setItem("subtotal_compra", totalFinalFormatado);
        // OBS: Usei o totalFinalFormatado (após desconto, se houver)
      }

      // Ir para resumo (MODIFICADO para CHAMA a função carregarResumo)
      finalizarCompra.addEventListener("click", () => {
        carregarResumo(); // 🎯 Esta chamada salva o valor antes de ir para a tela de resumo
        cartSection.classList.add("hidden");
        resumoSection.classList.remove("hidden");
      });

      // Remover item
      cartItems.addEventListener("click", (e) => {
        if (e.target.classList.contains("remove")) {
          const index = e.target.dataset.index;
          cart.splice(index, 1);
          atualizarCarrinho();
          salvarCarrinho();

          if (cart.length === 0) {
            localStorage.removeItem("carrinho");
            cartSection.classList.add("hidden");
            giftContainer.classList.remove("hidden");
            document.querySelector(".top-bar").style.display = "flex";
          }
        }
      });

      // Adicionar mais itens
      addMoreBtn.addEventListener("click", () => {
        cartSection.classList.add("hidden");
        giftContainer.classList.remove("hidden");
        document.querySelector(".top-bar").style.display = "flex";
      });

      // Ir para resumo
      finalizarCompra.addEventListener("click", () => {
        cartSection.classList.add("hidden");
        resumoSection.classList.remove("hidden");
      });

      // Voltar ao carrinho
      voltarCarrinho.addEventListener("click", () => {
        resumoSection.classList.add("hidden");
        cartSection.classList.remove("hidden");
      });
    </script>

    <script>
      // Função que testa uma imagem carregando ela manualmente
      function testarImagem(src) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve({ src, ok: true });
          img.onerror = () => resolve({ src, ok: false });
          img.src = src + "?cache=" + Math.random(); // evita cache
        });
      }

      async function verificarImagens() {
        const imagens = Array.from(document.querySelectorAll("img"));
        const resultados = [];

        for (const img of imagens) {
          const src = img.getAttribute("src");
          const resultado = await testarImagem(src);
          resultados.push(resultado);
        }

        console.log(
          "%c🔍 Resultado do Teste de Imagens:",
          "font-size:16px; font-weight:bold;"
        );

        resultados.forEach((r) => {
          if (r.ok) {
            console.log("%c✔ OK: " + r.src, "color:green;");
          } else {
            console.log(
              "%c❌ QUEBRADA: " + r.src,
              "color:red; font-weight:bold;"
            );
          }
        });

        console.log("%cTeste concluído!", "font-size:14px; color:blue;");
      }

      document.addEventListener("DOMContentLoaded", verificarImagens);
    </script>
  </body>
</html>
