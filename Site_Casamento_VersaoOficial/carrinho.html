<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Martha e Odilon 💍</title>

  <!-- Estilos principais -->
  <link rel="stylesheet" href="css/styleFundo.css" />
  <link rel="stylesheet" href="css/styleConfirma.css" />
  <link rel="stylesheet" href="css/stylePresente.css" />

  <!-- EmailJS -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="text/javascript">
    (function () {
      emailjs.init({
        publicKey: "eAZGTiwy6gWHSmOZ1",
      });
    })();
  </script>
</head>

<body class="corpo_site" id="carrinho">
  <!-- ===== MENU SUPERIOR ===== -->

  <header class="header">
    <button class="hamburger" id="hamburger-button" aria-label="Abrir menu">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </button>
    <nav class="menu" id="main-menu">
      <a href="index.html">Home</a>
    </nav>
  </header>

  <!-- Carrinho -->

  <section id="presentes" class="secao-presentes"> 
        <div id="presentesListagem" class="presentes-listagem">

            <div class="cabecalho-presentes">...</div>

            <div class="top-bar">
                <button id="cartButton" class="cart">Carrinho vazio</button>
                <div class="sort">...</div>
            </div>
            
            <div id="giftContainer" class="gift-items-grid">
                </div>
            
        </div>
    </section>
    
    <section id="cartSection" class="cart-section hidden">
        <h2>Meu carrinho</h2>
        </section>

    <table class="cart-table">
      <thead>
        <tr>
          <th>Descrição do presente</th>
          <th>Valor</th>
        </tr>
      </thead>
      <tbody id="cartItems"></tbody>
    </table>
    <div class="cart-total">
      <strong>Total:</strong> <span id="cartTotal">R$ 0,00</span>
    </div>

    <div class="cart-buttons">
      <button id="addMore" class="btn-gray">Adicionar mais itens</button>
      <a href="resumo.html" id="finalizarCompra" class="btn-pink">Continuar compra</a>
    </div>
  </section>

  <!-- ===== SCRIPTS ===== -->
  <script src="scripts/scriptMenu.js"></script>
  <script src="scripts/scriptPresente.js"></script>

  <script src="scripts/scriptMusica.js"></script>
  <script src="scripts/scriptConfirma.js"></script>
  <script src="scripts/scriptContagem.js"></script>
  
</body>

</html>
